[model_architecture]
# source token space size
src_vocb_size = 11
# target token space size
tgt_vocb_size = 1
# model dimension size
d_model = 128
# attention head number
num_heads = 8
# small convolution kernel size
s_conv_kernel = 5
# large convolution kernel size
l_conv_kernel = 21
# maximum input residule length, used for positional encoding layers
max_seq_length = 630
# max_seq_length = 285
# embeding base for positional encoding to control the theta size
# emb_base should be much larger than the max_seq_length
emb_base = 10000
# data type of the model, should be the torch datatype
dtype = torch.float
# hidden dimension of PositionWiseFeedForward layer, normally larger than d_model
d_ff = 768
# hyena filter: order
order = 16
# hyena filter: emb_dim
emb_dim = 3

[model_selection]
# correlation model: NT3D
# distance
model_class = 'correlation'